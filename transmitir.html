<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transmitir</title><style>body{font-family:Arial;background:#111;color:white;text-align:center;padding:20px}video{width:100%;max-width:800px;background:#000;border-radius:14px}button{padding:16px;margin:8px;border:0;border-radius:10px;font-weight:bold;font-size:17px}#start{background:#d71920;color:#fff}#stop{background:#444;color:#fff}#code{font-size:32px;font-weight:bold;letter-spacing:6px}</style></head><body><h1>🎥 TRANSMITIR EN VIVO</h1><p id="status">Listo.</p><video id="v" autoplay playsinline muted></video><br><button id="start">ACTIVAR CÁMARA Y MICRÓFONO</button><button id="stop" disabled>DETENER</button><p>Código:</p><div id="code">------</div><script src="/socket.io/socket.io.js"></script><script>const s=io(),v=document.getElementById("v"),st=document.getElementById("start"),sp=document.getElementById("stop"),msg=document.getElementById("status"),cb=document.getElementById("code");let stream,pc,room;const cfg={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};st.onclick=async()=>{st.disabled=true;try{if(!isSecureContext)throw Error("La página no está usando HTTPS.");stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});v.srcObject=stream;room=Math.random().toString(36).slice(2,8).toUpperCase();cb.textContent=room;s.emit("create-room",room);msg.textContent="🟢 Cámara activada. Esperando a quien mira...";sp.disabled=false;}catch(e){msg.textContent="❌ "+e.message;st.disabled=false}};s.on("viewer-joined",async()=>{pc=new RTCPeerConnection(cfg);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>e.candidate&&s.emit("ice-candidate",{room,candidate:e.candidate});let o=await pc.createOffer();await pc.setLocalDescription(o);s.emit("offer",{room,offer:o});msg.textContent="🟢 Transmitiendo en vivo.";});s.on("answer",async a=>{if(pc)await pc.setRemoteDescription(a)});s.on("ice-candidate",async c=>{if(pc)try{await pc.addIceCandidate(c)}catch(e){}});sp.onclick=()=>{if(pc)pc.close();if(stream)stream.getTracks().forEach(t=>t.stop());v.srcObject=null;cb.textContent="------";msg.textContent="Detenida.";sp.disabled=true;st.disabled=false}</script></body></html>
