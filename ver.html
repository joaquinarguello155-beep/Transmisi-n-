<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ver transmisión</title><style>body{font-family:Arial;background:#111;color:white;text-align:center;padding:20px}input{padding:15px;font-size:20px;text-align:center}button{padding:15px;margin:10px;background:#d71920;color:white;border:0;border-radius:10px;font-size:17px}video{width:100%;max-width:1000px;background:#000;border-radius:14px}</style></head><body><h1>📺 VER TRANSMISIÓN</h1><input id="code" maxlength="6" placeholder="CÓDIGO"><button id="go">VER TRANSMISIÓN</button><p id="status">Ingresá el código.</p><video id="v" autoplay playsinline controls></video><script src="/socket.io/socket.io.js"></script><script>const s=io(),v=document.getElementById("v"),inp=document.getElementById("code"),go=document.getElementById("go"),msg=document.getElementById("status");let pc,room;const cfg={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};go.onclick=()=>{room=inp.value.trim().toUpperCase();if(room.length!==6){msg.textContent="Escribí el código de 6 caracteres.";return}pc=new RTCPeerConnection(cfg);pc.ontrack=e=>{v.srcObject=e.streams[0];msg.textContent="🟢 TRANSMISIÓN CONECTADA";v.play().catch(()=>{})};pc.onicecandidate=e=>e.candidate&&s.emit("ice-candidate",{room,candidate:e.candidate});s.emit("join-room",room);msg.textContent="Conectando..."};s.on("offer",async o=>{await pc.setRemoteDescription(o);let a=await pc.createAnswer();await pc.setLocalDescription(a);s.emit("answer",{room,answer:a})});s.on("ice-candidate",async c=>{if(pc)try{await pc.addIceCandidate(c)}catch(e){}});s.on("broadcaster-left",()=>{msg.textContent="La transmisión terminó.";v.srcObject=null})</script></body></html>
